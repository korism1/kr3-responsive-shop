<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Оформление заявки. Учебный каталог смартфонов ShopProject."><title>Оформление заявки — ShopProject</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/main.js" defer></script></head><body><a class="skip-link" href="#main-content">Перейти к содержимому</a><header><div class="site-header"><a class="site-logo" href="index.html">ShopProject</a><nav class="site-nav" id="site-nav" aria-label="Основная навигация"><ul class="site-nav__list"><li><a href="index.html" >Главная</a></li><li><a href="catalog.html" >Каталог</a></li><li><a href="order.html" aria-current="page">Заявка</a></li><li><a href="contacts.html" >Контакты</a></li></ul></nav></div></header><main id="main-content" class="main" tabindex="-1"><section class="section order-section"><h1>Оформление заявки</h1><p id="order-product-name">Заказ смартфона или консультация по выбору.</p><form class="order-form" id="order-form" action="#" method="post" novalidate data-order-form>
      <input id="selected-product" name="selected-product" type="hidden">

      <div class="form-field">
        <label for="order-name">Имя</label>
        <input
          id="order-name"
          name="name"
          type="text"
          placeholder="Введите ваше имя"
          minlength="2"
          autocomplete="given-name"
          required
        >
      </div>

      <div class="form-field">
        <label for="order-email">E-mail</label>
        <input
          id="order-email"
          name="email"
          type="email"
          placeholder="example@mail.ru"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-field">
        <label for="order-phone">Телефон</label>
        <input
          id="order-phone"
          name="phone"
          type="tel"
          inputmode="tel"
          placeholder="+7 (900) 000-00-00"
          pattern="[+0-9\(\) \-]{10,22}" autocomplete="tel" aria-describedby="phone-hint"
          required
        >
        <small id="phone-hint">Например: +7 (900) 000-00-00 или +79000000000</small>
      </div>

      <div class="form-field">
        <label for="order-date">Дата связи</label>
        <input
          id="order-date"
          name="date"
          type="date"
        >
      </div>

      <div class="form-field">
        <label for="order-topic">Тема заявки</label>
        <select id="order-topic" name="topic" required>
          <option value="">Выберите тему</option>
          <option value="product">Заказ товара</option>
          <option value="consultation">Консультация</option>
          <option value="delivery">Доставка</option>
        </select>
      </div>

      <div class="form-field form-field--wide">
        <label for="order-comment">Комментарий</label>
        <textarea
          id="order-comment"
          name="comment"
          rows="4"
          placeholder="Укажите дополнительную информацию"
        ></textarea>
      </div>

      <div class="form-field form-field--checkbox">
        <label>
          <input
            id="order-agreement"
            name="agreement"
            type="checkbox"
            required
          >
          Я согласен на обработку данных в этой учебной форме
        </label>
      </div>

      <p class="form-note">Обязательные поля: имя, e-mail, телефон, тема и согласие.</p><p class="form-status" role="status"></p><div class="form-actions">
        
        <button class="button" type="submit">Отправить заявку</button>
      </div>
    </form></section></main><footer id="contacts"><div class="footer-inner"><p><strong>ShopProject</strong></p></div></footer></body></html>
